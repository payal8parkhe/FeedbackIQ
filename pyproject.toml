[project]
name = "feedbackiq"
version = "0.1.0"
description = "AI Customer Feedback Intelligence Platform with Schema-Validated Enrichment, Hybrid RAG, and Cost/Latency Observability"
authors = [{ name = "FeedbackIQ Team", email = "engineering@feedbackiq.local" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "jinja2>=3.1.4",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
postgres = [
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.5",
    "alembic>=1.13.3",
]
redis = [
    "redis>=5.1.0",
    "arq>=0.26.0",
]
llm = [
    "openai>=1.50.0",
    "anthropic>=0.36.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "unit: fast unit tests without network or external services",
    "integration: tests requiring database or fake servers",
    "eval: evaluation tests against gold benchmarks",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
