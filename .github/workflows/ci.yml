name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic pytest
          pip install -e .
      - name: Run Ruff Lint
        run: ruff check backend
      - name: Run Mypy Typecheck
        run: mypy backend/app --ignore-missing-imports

  unit-and-eval-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Unit Tests
        run: pytest backend/tests/unit -v --cov=backend/app
      - name: Run Eval Smoke Gate (Fail CI on regression)
        run: |
          python -m app.evaluation.runner --split dev --smoke --max-items 30 --report-out /tmp/smoke_report.json
          python -m app.evaluation.compare --base backend/app/evaluation/gold/baseline_report.json --candidate /tmp/smoke_report.json --fail-on-regression
